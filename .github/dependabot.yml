version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      runtime-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Zod 4 changes public schema types and requires a deliberate migration.
      - dependency-name: zod
        update-types:
          - version-update:semver-major
      # Keep type checking aligned with the oldest supported Node.js major.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # Newer Prettier 3 minors rewrite public docs and need a dedicated baseline change.
      - dependency-name: prettier
        versions:
          - ">=3.7.0 <4.0.0"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

