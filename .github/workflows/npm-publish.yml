name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example 0.10.0); tag v<version> must exist"
        required: true
        type: string
      registry_metadata_ref:
        description: "Optional branch or ref containing a metadata-only Registry correction"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject high-severity dependency vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
            git rev-parse "refs/tags/v${version}" >/dev/null 2>&1 || {
              echo "Tag v${version} does not exist. Create and push it before manual publishing."
              exit 1
            }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node scripts/check-release.mjs "$version"

      - name: Type check and test
        run: |
          pnpm run check
          pnpm test
          python -m unittest discover -s tests -p "test_*.py"

      - name: Install Ruff and run quality checks
        run: |
          python -m pip install ruff==0.12.9
          pnpm run format:check
          pnpm run lint:python
          pnpm run docs:tools:check

      - name: Build and inspect package
        run: |
          pnpm run build
          npm pack --dry-run

      - name: Check whether npm version already exists
        id: npm
        shell: bash
        run: |
          if npm view "keyshot-mcp@${{ steps.release.outputs.version }}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "keyshot-mcp@${{ steps.release.outputs.version }} is already published; skipping npm publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.exists != 'true'
        run: npm publish --access public

      - name: Wait for npm registry visibility
        shell: bash
        run: |
          for attempt in {1..12}; do
            npm view "keyshot-mcp@${{ steps.release.outputs.version }}" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "npm package did not become visible in time"
          exit 1

      - name: Create GitHub Release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.release.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; skipping."
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi

  registry:
    name: Publish official MCP Registry (preview)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.registry_metadata_ref != '' && inputs.registry_metadata_ref || (github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref) }}

      - name: Install MCP Registry publisher
        shell: bash
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Check whether MCP Registry version already exists
        id: registry
        shell: bash
        run: |
          response="$(curl -fsSL 'https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.truman-t3%2Fkeyshot-mcp' || echo '{}')"
          if echo "$response" | jq -e --arg version "${{ needs.publish.outputs.version }}" '.servers[]? | select(.server.name == "io.github.truman-t3/keyshot-mcp" and .server.version == $version)' >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "MCP Registry version already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to MCP Registry
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.registry.outputs.exists != 'true'
        run: ./mcp-publisher publish
