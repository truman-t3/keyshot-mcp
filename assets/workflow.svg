<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="244" viewBox="0 0 1160 244" role="img" aria-labelledby="title desc">
<title id="title">From a request to a KeyShot render / 从一句话到 KeyShot 出图</title>
<desc id="desc">Describe the change, let the Agent identify the object and material, edit a saved scene copy, review a preview, then confirm rendering and export. 提出材质替换需求，Agent 确认对象，在已保存场景的副本上修改，查看预览，确认后输出图片与场景副本。</desc>
<style>text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.arrow{fill:none;stroke:#0969da;stroke-width:2;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#0969da"/></marker></defs>
<rect width="1160" height="244" fill="#f6f8fa" rx="8"/>
<g transform="translate(16 32)"><rect width="208" height="168" rx="8" fill="#ffffff" stroke="#d0d7de"/><circle cx="27" cy="27" r="13" fill="#0969da"/><text x="27" y="33" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">1</text><text x="16" y="66" fill="#1f2328" font-size="17" font-weight="700">Describe the change</text><text x="16" y="92" fill="#1f2328" font-size="20" font-weight="700">一句话说出需求</text><text x="16" y="121" fill="#57606a" font-size="15">Replace metal only</text><text x="16" y="144" fill="#57606a" font-size="16">只换金属，保留玻璃</text></g>
<g transform="translate(246 32)"><rect width="208" height="168" rx="8" fill="#ffffff" stroke="#d0d7de"/><circle cx="27" cy="27" r="13" fill="#0969da"/><text x="27" y="33" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">2</text><text x="16" y="66" fill="#1f2328" font-size="17" font-weight="700">Agent checks</text><text x="16" y="92" fill="#1f2328" font-size="20" font-weight="700">Agent 确认对象</text><text x="16" y="121" fill="#57606a" font-size="15">Find object + material</text><text x="16" y="144" fill="#57606a" font-size="16">识别对象与可用材质</text></g>
<g transform="translate(476 32)"><rect width="208" height="168" rx="8" fill="#ffffff" stroke="#d0d7de"/><circle cx="27" cy="27" r="13" fill="#0969da"/><text x="27" y="33" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">3</text><text x="16" y="66" fill="#1f2328" font-size="17" font-weight="700">Edit a scene copy</text><text x="16" y="92" fill="#1f2328" font-size="20" font-weight="700">KeyShot 处理副本</text><text x="16" y="121" fill="#57606a" font-size="15">Apply brushed steel</text><text x="16" y="144" fill="#57606a" font-size="16">将金属替换为拉丝钢</text></g>
<g transform="translate(706 32)"><rect width="208" height="168" rx="8" fill="#ffffff" stroke="#d0d7de"/><circle cx="27" cy="27" r="13" fill="#0969da"/><text x="27" y="33" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">4</text><text x="16" y="66" fill="#1f2328" font-size="17" font-weight="700">Review the preview</text><text x="16" y="92" fill="#1f2328" font-size="20" font-weight="700">你查看预览</text><text x="16" y="121" fill="#57606a" font-size="15">Confirm or adjust</text><text x="16" y="144" fill="#57606a" font-size="16">满意就确认，不满意再改</text></g>
<g transform="translate(936 32)"><rect width="208" height="168" rx="8" fill="#e8f5ef" stroke="#d0d7de"/><circle cx="27" cy="27" r="13" fill="#0969da"/><text x="27" y="33" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">5</text><text x="16" y="66" fill="#1f2328" font-size="17" font-weight="700">Export after approval</text><text x="16" y="92" fill="#1f2328" font-size="20" font-weight="700">确认后输出</text><text x="16" y="121" fill="#57606a" font-size="15">PNG + .bip scene copy</text><text x="16" y="144" fill="#57606a" font-size="16">渲染图片与场景副本</text></g>
<path d="M231 116 h12" class="arrow"/>
<path d="M461 116 h12" class="arrow"/>
<path d="M691 116 h12" class="arrow"/>
<path d="M921 116 h12" class="arrow"/>
</svg>
